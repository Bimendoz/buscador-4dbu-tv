<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Informe de pasos · HLS Stream Detector</title>
<style>
  :root {
    --bg: #0b0d10; --panel: #12151a; --panel2: #181c22; --raise: #1f242c; --line: #242a33; --line2: #2f3640;
    --text: #e6e8eb; --muted: #8a919c; --dim: #5d6470; --red: #ff3b30; --green: #2fd158; --amber: #ffb020; --blue: #3d8bfd;
    --mono: "JetBrains Mono", "Cascadia Mono", "SF Mono", Consolas, ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.5 system-ui, "Segoe UI", sans-serif; }
  .brand { display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #07080a; border-bottom: 1px solid var(--line); font: 600 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .brand .tally { width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 6px var(--red); }
  .brand b { color: var(--text); }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  h1 { font-size: 18px; margin: 0; }
  .lead { color: var(--muted); margin: 0; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  select, input[type=text] { font: inherit; padding: 6px 8px; border: 1px solid var(--line2); border-radius: 4px; background: var(--bg); color: var(--text); }
  input[type=text] { flex: 1; min-width: 220px; }
  select { max-width: 100%; }
  button { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; font: 600 12px inherit; cursor: pointer; border: 1px solid var(--line2); background: var(--panel2); color: var(--text); border-radius: 4px; }
  button:hover { background: var(--raise); }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  button.danger { color: var(--red); }
  button.done { background: var(--green); border-color: var(--green); color: #04150a; }
  .stats { font: 11px var(--mono); color: var(--muted); }
  textarea { width: 100%; min-height: 62vh; resize: vertical; font: 11.5px/1.5 var(--mono); padding: 10px; background: #07080a; color: var(--text); border: 1px solid var(--line); border-radius: 4px; white-space: pre; }
  .empty { color: var(--muted); padding: 30px; text-align: center; }
  small { color: var(--dim); }
</style>
</head>
<body>
  <div class="brand"><span class="tally"></span><b>HLS Stream Detector</b><span>· Informe de pasos</span></div>
  <main>
    <h1>Informe de pasos grabados</h1>
    <p class="lead">Lo que hiciste a mano, paso a paso, con lo que pasó después de cada acción (red, iframes, pestañas, reproductor). Cópialo y pégalo en el chat con Claude.</p>
    <div class="card" id="ctl">
      <div class="row">
        <select id="sel"></select>
        <span class="stats" id="stats"></span>
      </div>
      <div class="row">
        <label><input type="checkbox" id="mine" checked> Tapar el dominio de mi sitio (queda como «misitio.com»)</label>
        <label><input type="checkbox" id="all"> Tapar TODOS los dominios <small>(no recomendado: los nombres de los servidores ayudan a entender)</small></label>
      </div>
      <div class="row">
        <input type="text" id="extra" placeholder="Otros dominios tuyos a tapar, separados por coma (p. ej. micdn.net, otrositio.org)">
      </div>
      <div class="row">
        <button class="primary" id="copy">Copiar informe</button>
        <button id="dl">Descargar .txt</button>
        <button class="danger" id="del">Borrar este informe</button>
      </div>
    </div>
    <textarea id="out" readonly spellcheck="false"></textarea>
  </main>
  <script src="lib/common.js"></script>
  <script src="informe.js"></script>
</body>
</html>
