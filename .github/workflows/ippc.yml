# +4dBu TV · lee el catálogo de IPPC cada noche (sin tu PC). Lo enciende tu puente.
# Repositorio público = minutos gratis. Aquí NO viaja nada tuyo: solo el número de la tarea.
# La dirección de tu página es un secreto (TV_PAGE). El código del portal lo manda el puente.
name: ippc
on:
  workflow_dispatch:
    inputs:
      id: { description: "tarea", required: true }
      t: { description: "llave de esa tarea", required: true }
run-name: "Catálogo IPPC ${{ inputs.id }}"
jobs:
  ippc:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Leer el catálogo y entregarlo al puente
        working-directory: runner
        env:
          TV_URL: ${{ secrets.TV_PAGE }}
          JOB_ID: ${{ inputs.id }}
          JOB_T: ${{ inputs.t }}
        run: node ippc.mjs
