# +4dBu TV · tu buscador (la extensión tal cual) corriendo en un Chrome de GitHub.
# Lo enciende tu página cuando buscas. No hay que tocar nada aquí.
# Repositorio público = minutos ilimitados y gratis. Aquí NO viaja nada tuyo: solo el número de la búsqueda.
# La dirección de tu página es un secreto (TV_PAGE, oculto en los registros) y la búsqueda se recoge de tu página.
name: buscar
on:
  workflow_dispatch:
    inputs:
      id: { description: "búsqueda", required: true }
      t: { description: "llave de esa búsqueda", required: true }
run-name: "Buscar ${{ inputs.id }}"
jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Avisar a tu página que ya arrancó
        env:
          TV_URL: ${{ secrets.TV_PAGE }}
          JOB_ID: ${{ inputs.id }}
          JOB_T: ${{ inputs.t }}
        run: |
          curl -s -m 10 -o /dev/null -X POST -H "content-type: application/json" \
            --data '{"status":"running","step":"GitHub arrancó: preparando Chrome…"}' \
            "$TV_URL/gh/avance?id=$JOB_ID&t=$JOB_T" || true
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # Rápido: Chrome y las piezas quedan guardados entre búsquedas (no se descargan cada vez)
      - name: Chrome guardado
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chrome-${{ runner.os }}-pw-1.56.1
      - name: Piezas guardadas
        uses: actions/cache@v4
        with:
          path: runner/node_modules
          key: nm-${{ runner.os }}-${{ hashFiles('runner/package.json') }}
      - name: Preparar
        working-directory: runner
        run: |
          [ -d node_modules/playwright ] || npm install --no-audit --no-fund --silent
          [ -d ~/.cache/ms-playwright ] && ls ~/.cache/ms-playwright | grep -q chromium || npx playwright install chromium > /dev/null
          node -e "import('playwright').then(async({chromium})=>{const b=await chromium.launch();await b.close()}).catch(()=>process.exit(1))" || npx playwright install-deps chromium > /dev/null
      - name: Buscar
        working-directory: runner
        env:
          EXT_DIR: ${{ github.workspace }}/extension
          TV_URL: ${{ secrets.TV_PAGE }}
          JOB_ID: ${{ inputs.id }}
          JOB_T: ${{ inputs.t }}
        run: node buscar.mjs
